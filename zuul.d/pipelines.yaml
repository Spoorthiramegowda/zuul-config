---
- name: Create two files, merge, and upload to Artifactory (single file)
  hosts: all
  gather_facts: false

  vars:
    file1_path: "/tmp/input1.txt"
    file2_path: "/tmp/input2.txt"
    file1_content: "Hello from file #1 on {{ inventory_hostname }}\n"
    file2_content: "Hello from file #2 on {{ inventory_hostname }}\n"

    staging_dir: "{{ zuul.executor.work_root }}/combine"
    work_artifacts_dir: "{{ zuul.executor.work_root }}/artifacts"

    artifactory_base: "https://artifactory.example.com"
    artifactory_context: "/artifactory"                 # set "" if not needed
    artifactory_repo_path_prefix: "/generic-local/combined"

  tasks:
    - name: Create input file #1 on remote
      ansible.builtin.copy:
        dest: "{{ file1_path }}"
        content: "{{ file1_content }}"
        mode: '0644'

    - name: Create input file #2 on remote
      ansible.builtin.copy:
        dest: "{{ file2_path }}"
        content: "{{ file2_content }}"
        mode: '0644'

    - name: Ensure staging and artifacts dirs exist on executor
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ staging_dir }}"
        - "{{ work_artifacts_dir }}"
      delegate_to: localhost
      run_once: true

    - name: Fetch input1 to executor staging
      ansible.builtin.fetch:
        src: "{{ file1_path }}"
        dest: "{{ staging_dir }}/in1-{{ inventory_hostname }}.txt"
        flat: true

    - name: Fetch input2 to executor staging
      ansible.builtin.fetch:
        src: "{{ file2_path }}"
        dest: "{{ staging_dir }}/in2-{{ inventory_hostname }}.txt"
        flat: true

    - name: Concatenate inputs into a combined file (executor)
      ansible.builtin.shell: >
        cat "{{ staging_dir }}/in1-{{ inventory_hostname }}.txt"
            "{{ staging_dir }}/in2-{{ inventory_hostname }}.txt"
        > "{{ work_artifacts_dir }}/combined-{{ inventory_hostname }}-{{ zuul.build }}.txt"
      args:
        executable: /bin/bash
      delegate_to: localhost

    # --- NEW: resolve API key (secret > var > env) ---------------------------------
    - name: Resolve Artifactory API key (secret > var > env)
      ansible.builtin.set_fact:
        artifactory_api_key_effective: >-
          {{
            (artifactory.artifactory_api_key
             if (artifactory is defined and artifactory.artifactory_api_key is defined)
             else (artifactory_api_key
                   if (artifactory_api_key is defined)
                   else lookup('env', 'ARTIFACTORY_API_KEY')))
          }}
      delegate_to: localhost
      run_once: true
    # -------------------------------------------------------------------------------

    - name: Upload combined file to Artifactory (per host)
      ansible.builtin.uri:
        url: >-
          {{ artifactory_base }}{{ artifactory_context }}
          {{ artifactory_repo_path_prefix }}/{{ zuul.build }}
          /combined-{{ inventory_hostname }}-{{ zuul.build }}.txt
        method: PUT
        src: "{{ work_artifacts_dir }}/combined-{{ inventory_hostname }}-{{ zuul.build }}.txt"
        status_code: [200, 201]
        headers:
          X-JFrog-Art-Api: "{{ artifactory_api_key_effective }}"
      delegate_to: localhost

    - name: Register Artifactory link with Zuul (per host)
      zuul_return:
        data:
          artifacts:
            - name: "Combined file ({{ inventory_hostname }})"
              url: >-
                {{ artifactory_base }}{{ artifactory_context }}
                {{ artifactory_repo_path_prefix }}/{{ zuul.build }}
                /combined-{{ inventory_hostname }}-{{ zuul.build }}.txt
      delegate_to: localhost

    - name: Display external artifact URL
      ansible.builtin.debug:
        msg: |
          ========================================
          Artifact uploaded to Artifactory!
          URL: {{ artifactory_base }}{{ artifactory_context }}{{ artifactory_repo_path_prefix }}/{{ zuul.build }}/combined-{{ inventory_hostname }}-{{ zuul.build }}.txt
          ========================================
      delegate_to: localhost
